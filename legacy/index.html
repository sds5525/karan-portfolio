<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Karan S Achar — Work</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
:root{--bg:#f1f0ee;--fg:#111;--mute:#8a8985;--line:#111;--sans:'Inter',system-ui,sans-serif;--serif:'Instrument Serif',Georgia,serif;--mono:'JetBrains Mono',ui-monospace,monospace;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e0e0e;--fg:#eceae6;--mute:#77756f;--line:#eceae6}}
:root[data-theme="dark"]{--bg:#0e0e0e;--fg:#eceae6;--mute:#77756f;--line:#eceae6}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);overflow:hidden}
a{color:inherit;text-decoration:none}
.nav{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;display:flex;justify-content:center;gap:28px;padding:14px;z-index:300;font-size:15px;align-items:center}
.nav .brand{font-family:var(--serif);font-size:24px;letter-spacing:.02em}
.nav a.on::after{content:"";display:block;width:4px;height:4px;border-radius:50%;background:var(--fg);margin:2px auto -6px}
.nav .off{color:var(--mute)}
.idx{position:relative}
.idx button{all:unset;cursor:pointer;color:var(--mute)}
.idx ul{display:none;position:absolute;top:30px;left:50%;transform:translateX(-50%);margin:0;padding:12px 16px;list-style:none;background:var(--bg);border:1px solid var(--line);min-width:220px}
.idx.open ul{display:block}
.idx li{padding:4px 0;display:flex;justify-content:space-between;gap:16px}
.idx li span{color:var(--mute);font-family:var(--mono);font-size:12px}
#work{position:fixed;inset:0;overflow:hidden;touch-action:none;cursor:grab}
.info{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));left:14px;width:min(320px,42vw);z-index:200;pointer-events:none}
.info h1{font-family:var(--serif);font-weight:400;font-size:clamp(34px,4.4vw,60px);line-height:.95;margin:0 0 12px;text-transform:uppercase}
.row{display:flex;justify-content:space-between;gap:12px;border-top:1px solid var(--line);padding:8px 0;font-size:clamp(14px,1.4vw,19px);text-align:right}
.row b{font:400 10px var(--mono);letter-spacing:.16em;text-transform:uppercase;text-align:left;padding-top:5px}
.stage{position:absolute;inset:0}
.item{position:absolute;left:50%;top:46%;width:var(--s);height:var(--s);will-change:transform;cursor:pointer}
:root{--s:min(50vw,62vh)}
.disc{position:absolute;inset:0;border-radius:50%;overflow:hidden;box-shadow:0 0 0 3px #b9b9bd,0 0 0 4px #77777c,0 30px 60px -30px rgba(0,0,0,.5)}
.face{position:absolute;inset:0;border-radius:50%}
.disc svg{position:absolute;inset:0;width:100%;height:100%}
.disc svg text{font:400 5.2px var(--mono);letter-spacing:.35em;fill:#d9d7d2;text-transform:uppercase}
.hole{position:absolute;left:50%;top:50%;width:19%;height:19%;transform:translate(-50%,-50%);border-radius:50%;background:var(--bg);box-shadow:0 0 0 7px #c8c8cc,0 0 0 9px #8d8d92 inset}
.dtitle{position:absolute;left:12%;right:12%;bottom:20%;font:400 clamp(26px,5vw,72px)/.9 var(--serif);color:#f2efe8;text-transform:uppercase;transform:rotate(-7deg);text-shadow:0 2px 12px rgba(0,0,0,.4)}
.note{position:absolute;left:50%;top:100%;width:min(320px,70vw);transform:translateX(-50%);text-align:center;margin-top:14px;pointer-events:none}
.note small{display:block;font:400 10px var(--mono);letter-spacing:.18em;text-transform:uppercase;margin-bottom:6px}
.note p{margin:0;font:400 clamp(17px,2vw,28px)/1.05 var(--serif);text-transform:uppercase}
.hint{position:fixed;right:16px;bottom:calc(12px + env(safe-area-inset-bottom,0px));font:400 10px var(--mono);letter-spacing:.16em;color:var(--mute);z-index:200;text-transform:uppercase}
.ctr{position:fixed;left:14px;bottom:calc(12px + env(safe-area-inset-bottom,0px));font:400 11px var(--mono);z-index:200;color:var(--mute)}
#project{position:fixed;inset:0;overflow:auto;padding:84px 24px 40px;display:none}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:40px;max-width:1200px;margin:0 auto;align-items:center}
.pgrid h1{font:400 clamp(44px,8vw,110px)/.9 var(--serif);text-transform:uppercase;margin:12px 0 24px}
.pgrid p{font-size:18px;line-height:1.5;max-width:46ch}
.pdisc{position:relative;width:min(44vw,70vh);aspect-ratio:1;margin:auto;--s:min(44vw,70vh);animation:spin 40s linear infinite}
.pdisc .item{position:absolute;inset:0;width:100%;height:100%;left:0;top:0;cursor:default}
@keyframes spin{to{transform:rotate(360deg)}}
.pnav{display:flex;justify-content:space-between;max-width:1200px;margin:48px auto 0;font:400 12px var(--mono);letter-spacing:.14em;text-transform:uppercase;border-top:1px solid var(--line);padding-top:14px}
@media(max-width:760px){.pgrid{grid-template-columns:1fr}.pdisc{width:80vw;--s:80vw}.nav{gap:18px}.info{width:56vw}.hint{display:none}}
@media(prefers-reduced-motion:reduce){.pdisc{animation:none}}
body.home{--bg:#000;--fg:#eceae6;--mute:#8d8b92;--line:#eceae6}
#home{position:fixed;inset:0;display:none;color:#eceae6;background:#000;touch-action:none}
#cv{position:absolute;inset:0;width:100%;height:100%}
.hn,.hr{position:absolute;top:50%;font-size:clamp(16px,2vw,28px);letter-spacing:-.01em;opacity:0;animation:fi 1.2s var(--hd,1.6s) forwards;pointer-events:none}
.hn{left:5vw}.hr{right:5vw;text-align:right}
@keyframes fi{to{opacity:1}}
body{transition:background-color .9s ease,color .9s ease}
#home{animation:hf .6s ease}@keyframes hf{from{opacity:0}}
:root{--glass:rgba(255,255,255,.42);--glassd:rgba(255,255,255,.74);--glassl:rgba(255,255,255,.6)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--glass:rgba(255,255,255,.08);--glassd:rgba(28,28,30,.72);--glassl:rgba(255,255,255,.16)}}
body.home{--glass:rgba(255,255,255,.08);--glassd:rgba(28,28,30,.72);--glassl:rgba(255,255,255,.16)}
.brand{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:300;font-family:var(--serif);font-size:24px;letter-spacing:.02em}
.nav{top:auto;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;right:auto;width:max-content;transform:translateX(-50%);gap:4px;padding:5px;border-radius:999px;background:var(--glass);-webkit-backdrop-filter:blur(26px) saturate(180%);backdrop-filter:blur(26px) saturate(180%);border:1px solid var(--glassl);box-shadow:0 10px 30px rgba(0,0,0,.16),inset 0 1px 0 rgba(255,255,255,.45)}
.nav::before{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(180deg,rgba(255,255,255,.28),transparent 50%);pointer-events:none;z-index:-1}
.nav>a,.idx button{display:block;padding:9px 20px;border-radius:999px;font-size:14px;letter-spacing:.01em;color:var(--fg);transition:background .25s}
.nav>a:hover,.idx button:hover{background:rgba(127,127,127,.18)}
.nav a.on{background:rgba(127,127,127,.22)}
.nav a.on::after{display:none}
.idx ul{top:auto;bottom:calc(100% + 14px);border-radius:22px;padding:10px 16px;background:var(--glassd);-webkit-backdrop-filter:blur(26px) saturate(180%);backdrop-filter:blur(26px) saturate(180%);border:1px solid var(--glassl);box-shadow:0 14px 40px rgba(0,0,0,.2)}
#project{padding-bottom:110px}
.hbar{display:none!important}
@media(max-width:760px){.hbar{bottom:calc(78px + env(safe-area-inset-bottom,0px))}.hn,.hr{bottom:116px}}
.leaving .hn,.leaving .hr,.leaving .hbar{opacity:0!important;animation:none}
.hbar{position:absolute;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-between;padding:0 16px;font:400 11px var(--mono);letter-spacing:.14em;text-transform:uppercase;z-index:2}
.hbar{opacity:0;animation:fi 1s var(--hd,1.6s) forwards}
.hbar label{cursor:pointer;color:#8d8b92}.hbar input{display:none}.hbar a{color:#eceae6}
@media(max-width:760px){.hn,.hr{top:auto;bottom:80px}.hn{left:16px}.hr{right:16px}}
</style>
</head>
<body>
<a class="brand" href="#home">MSLOTW</a>
<nav class="nav">
  <a href="#work" class="on" id="navwork">Work</a>
  <div class="idx" id="idx"><button type="button" aria-expanded="false">Index ▾</button><ul id="idxlist"></ul></div>
</nav>
<section id="work">
  <aside class="info" id="info"></aside>
  <div class="stage" id="stage"></div>
</section>
<section id="home"><canvas id="cv"></canvas><span class="hn">Karan S Achar</span><span class="hr">Creative Developer</span><div class="hbar"><label>Use your photo<input type="file" id="photo" accept="image/*"></label><a href="#work">View work →</a></div></section>
<canvas id="cv2" style="position:fixed;inset:0;width:100%;height:100%;display:none;pointer-events:none;z-index:250"></canvas>
<div class="ctr" id="ctr"></div>
<div class="hint" id="hint">Scroll · Drag · ← →</div>
<section id="project"></section>

<script>
const P=[
 {s:'project-one',t:'Project One',role:['Design Lead'],year:2026,tools:['Figma','React'],hue:18,by:'Client name',n:'A short line about the result',d:'Replace this with a paragraph about the project: the problem, your approach, and what shipped. Two or three sentences is plenty.'},
 {s:'project-two',t:'Project Two',role:['Art Direction','Motion'],year:2025,tools:['After Effects','Blender'],hue:200,by:'Client name',n:'A quote or result worth highlighting',d:'Describe the brief, the constraints, and the outcome. Add links to live work or case studies below.'},
 {s:'project-three',t:'Project Three',role:['Full-stack Dev'],year:2025,tools:['Next.js','Postgres','Tailwind'],hue:320,by:'Client name',n:'Shipped in six weeks',d:'Explain your role, the tech decisions you made, and the measurable impact.'},
 {s:'project-four',t:'Project Four',role:['Brand Identity'],year:2024,tools:['Illustrator','Type design'],hue:95,by:'Client name',n:'Identity for a new studio',d:'Share the story behind the identity system and how it was applied across touchpoints.'},
 {s:'project-five',t:'Project Five',role:['Product Design','Research'],year:2023,tools:['Figma','Maze'],hue:260,by:'Client name',n:'Conversion up across the board',d:'Summarize the research, the redesign, and the numbers that moved.'},
 {s:'project-six',t:'Project Six',role:['Creative Dev'],year:2022,tools:['WebGL','GSAP'],hue:40,by:'Client name',n:'An experiment that took off',d:'Tell the story of this experiment and where people can see it.'}
];
const $=id=>document.getElementById(id);
const pad=n=>String(n+1).padStart(2,'0');
function disc(p,i){
 const h=p.hue,ring=[...p.role,...p.tools,p.year].join(' · ').toUpperCase();
 return `<div class="item" data-i="${i}"><div class="disc"><div class="face" style="background:radial-gradient(circle at 28% 24%,hsl(${h} 70% 62%),hsl(${h+35} 55% 22%) 48%,#0b0b0c 80%),conic-gradient(from ${h}deg,transparent,rgba(255,255,255,.08),transparent 40%)"></div>
 <svg viewBox="0 0 100 100" aria-hidden="true"><defs><path id="r${i}${p.s}" d="M50,50 m-44,0 a44,44 0 1,1 88,0 a44,44 0 1,1 -88,0"/></defs><text><textPath href="#r${i}${p.s}">${ring} · ${ring}</textPath></text></svg>
 <div class="dtitle">${p.t}</div><div class="hole"></div></div>
 <div class="note"><small>${p.by}</small><p>“${p.n}”</p></div></div>`;
}
// index
$('idxlist').innerHTML=P.map((p,i)=>`<li><a href="#${p.s}">${p.t}</a><span>${p.year}</span></li>`).join('');
$('idx').firstChild.addEventListener('click',()=>{$('idx').classList.toggle('open')});
document.addEventListener('click',e=>{if(!$('idx').contains(e.target))$('idx').classList.remove('open')});
// carousel
$('stage').innerHTML=P.map(disc).join('');
const items=[...document.querySelectorAll('#stage .item')];
let pos=0,target=0,shown=-1,idle,moved=false,running=true;
function info(i){const p=P[i];
 $('info').innerHTML=`<h1>${p.t}</h1><div class="row"><b>Role</b><span>${p.role.join('<br>')}</span></div><div class="row"><b>Year</b><span>${p.year}</span></div><div class="row"><b>Built with</b><span>${p.tools.join('<br>')}</span></div>`;
 $('ctr').textContent=pad(i)+' / '+pad(P.length-1);}
const ez=x=>1-Math.pow(1-x,3);let enter=0,ip=1,ipT=1,lock=0;
function frame(){
 if(running){
  pos+=(target-pos)*.11;
  const W=innerWidth,H=innerHeight;ip+=(ipT-ip)*.1;
  $('info').style.opacity=Math.min(1,Math.max(0,(ip-.6)/.35));
  items.forEach((el,i)=>{
   const d=i-pos,a=Math.abs(d);
   el.style.visibility=a>3?'hidden':'visible';
   el.style.zIndex=100-Math.round(a*10);const ki=ez(Math.max(0,Math.min(1,a<.5?ip/.65:(ip-.5-(a-1)*.05)/.3)));el.style.opacity=a<.5?Math.min(1,ki*6):Math.min(1,ki*2.5);
   el.style.transform=`translate(-50%,-50%) translate3d(${d*W*.36}px,${-d*H*.13+(1-ki)*(a<.5?H*1.05:70)}px,0) scale(${(1-Math.min(a,2.4)*.13)*(a<.5?.8+.2*ki:1)})`;
   const disc=el.firstChild;
   disc.style.transform=`perspective(1100px) rotate(${-14-d*12-(a<.5?(1-ki)*260:0)}deg) rotateX(${Math.min(a,2)*10+(a<.5?(1-ki)*62:0)}deg) rotateY(${-d*8}deg)`;
   el.querySelector('.note').style.opacity=Math.max(0,1-a*2.2)*Math.min(1,Math.max(0,(ip-.6)/.35));
  });
  const r=Math.round(pos);if(r!==shown){shown=r;info(r);}
 }
 requestAnimationFrame(frame);
}
const clamp=v=>Math.max(0,Math.min(P.length-1,v));
const settle=()=>{clearTimeout(idle);idle=setTimeout(()=>{target=Math.round(target)},140)};
const work=$('work');
work.addEventListener('wheel',e=>{e.preventDefault();const dy=Math.abs(e.deltaY)>Math.abs(e.deltaX)?e.deltaY:e.deltaX;if(ipT<1||(target<.05&&dy<0)){if(ipT<=.001&&dy<-40){location.hash='home';return}const was=ipT;ipT=Math.max(0,Math.min(1,ipT+dy*.0011));if(was<1&&ipT>=1)lock=performance.now()+450;return}if(performance.now()<lock)return;target=clamp(target+dy*.0016);settle()},{passive:false});
let sx=0,sy=0,down=false;
work.addEventListener('pointerdown',e=>{down=true;moved=false;sx=e.clientX;sy=e.clientY});
addEventListener('pointermove',e=>{if(!down)return;const dx=e.clientX-sx,dy=e.clientY-sy;
 if(Math.abs(dx)+Math.abs(dy)>6)moved=true;
 if(ipT<1||(target<.05&&dy>0)){ipT=Math.max(0,Math.min(1,ipT-dy/innerHeight*1.3));sx=e.clientX;sy=e.clientY;return}
 const m=Math.abs(dx)>Math.abs(dy)?dx:dy;target=clamp(target-m/innerWidth*1.5);sx=e.clientX;sy=e.clientY;settle()});
addEventListener('pointerup',()=>{down=false;settle()});
addEventListener('keydown',e=>{if(!running)return;
 if(['ArrowRight','ArrowDown'].includes(e.key)){if(ipT<1)ipT=Math.min(1,ipT+.35);else target=clamp(Math.round(target)+1)}
 if(['ArrowLeft','ArrowUp'].includes(e.key)){if(ipT<1||target<.05)ipT=Math.max(0,ipT-.35);else target=clamp(Math.round(target)-1)}
 if(e.key==='Enter')location.hash=P[Math.round(target)].s;});
items.forEach(el=>el.addEventListener('click',()=>{if(!moved)location.hash=P[el.dataset.i].s}));
// landing: particle portrait
const cv=$('cv'),g2=cv.getContext('2d');
let W=0,H=0,PS=[],t0=0,homeOn=false,hid=0,mx=-999,my=-999,custom=null,intro=true,burst=false,logoC=null,logoPts=[],ly=0,lh=0,LR=1,leaving=false,tL=0;
const still=matchMedia('(prefers-reduced-motion:reduce)').matches;
function silhouette(){
 const o=document.createElement('canvas');o.width=W;o.height=H;const g=o.getContext('2d');g.fillStyle='#fff';
 if(custom){const sc=Math.min(W*.9/custom.width,H*.96/custom.height),w=custom.width*sc,h=custom.height*sc;g.drawImage(custom,(W-w)/2,H-h,w,h)}
 else{const s=H,x=W/2;let q=7;const r=()=>(q=(q*16807)%2147483647)/2147483647;
  g.beginPath();g.ellipse(x,.37*s,.235*s,.27*s,0,0,7);g.fill();
  for(let a=0;a<56;a++){const t=Math.PI*(.85+a/55*1.3);g.beginPath();g.arc(x+Math.cos(t)*.24*s,.37*s+Math.sin(t)*.275*s,.034*s*(.6+r()*.9),0,7);g.fill()}
  g.fillRect(x-.125*s,.55*s,.25*s,.2*s);
  g.beginPath();g.moveTo(x-.125*s,.68*s);g.quadraticCurveTo(x-.2*s,.72*s,x-.35*s,.8*s);g.quadraticCurveTo(x-.55*s,.9*s,x-.6*s,s);g.lineTo(x+.6*s,s);g.quadraticCurveTo(x+.55*s,.9*s,x+.35*s,.8*s);g.quadraticCurveTo(x+.2*s,.72*s,x+.125*s,.68*s);g.fill()}
 const d=g.getImageData(0,0,W,H).data,c=[];
 for(let y=0;y<H;y+=2)for(let x=0;x<W;x+=2){const k=(y*W+x)*4,w=custom?(d[k+3]/255)*((d[k]+d[k+1]+d[k+2])/765):d[k+3]/255;if(w>.15)c.push(x,y,w)}
 return c}
function size(){W=innerWidth;H=innerHeight;const r=Math.min(devicePixelRatio||1,2);cv.width=W*r;cv.height=H*r;g2.setTransform(r,0,0,r,0,0)}

function drawLogo(t){g2.clearRect(0,0,W,H);g2.globalAlpha=Math.min(1,t/350);g2.shadowColor='rgba(170,200,255,.9)';g2.shadowBlur=22;const bh=Math.max(4,lh/9),gl=(t%650)<130||t>HOLD-350;
 for(let y=ly;y<ly+lh*1.2;y+=bh){const o=gl&&Math.random()<.5?(Math.random()-.5)*W*.035:0;g2.drawImage(logoC,0,y*LR,W*LR,bh*LR,o,y,W,bh)}
 g2.shadowBlur=0;g2.globalAlpha=1}
function loop(me){if(me!==hid||!homeOn)return;let t=performance.now()-t0;
 if(intro&&!burst){if(t<HOLD){drawLogo(t);requestAnimationFrame(()=>loop(me));return}
  burst=true;intro=false;PS.forEach(p=>{const a=Math.atan2(p.y-H/2,p.x-W/2)+(Math.random()-.5)*1.4,v=6+Math.random()*20;p.vx=Math.cos(a)*v;p.vy=Math.sin(a)*v});t0=performance.now();t=0}
 g2.clearRect(0,0,W,H);g2.fillStyle='#fff';
 const nl=performance.now()-tL;for(const p of PS){if(leaving&&nl>p.ld){p.vy-=p.la;p.vx*=.985;p.x+=p.vx;p.y+=p.vy}else if(t>p.dl){p.vx=(p.vx+(p.tx-p.x)*.012)*.93;p.vy=(p.vy+(p.ty-p.y)*.012)*.93;
   const dx=p.x-mx,dy=p.y-my,d2=dx*dx+dy*dy;if(d2<14000){const d=Math.sqrt(d2)+.1,f=(1-d/118)*3.2;p.vx+=dx/d*f;p.vy+=dy/d*f}
   p.x+=p.vx;p.y+=p.vy}
}
 g2.globalCompositeOperation='lighter';g2.globalAlpha=.16;for(let i=0;i<PS.length;i+=leaving?3:1){const p=PS[i];if(p.y>-12)g2.drawImage(GL,p.x-8,p.y-8,16,16)}
 g2.fillStyle='#fff';for(const p of PS){if(p.y<-12)continue;g2.globalAlpha=.45+p.b*.55;g2.fillRect(p.x-.2,p.y-.2,1.7,1.7)}
 g2.globalCompositeOperation='source-over';g2.globalAlpha=1;
 if(leaving&&(nl>2800||nl>900&&PS.every(p=>p.y<-14))){leaving=false;location.hash='work';return}
 requestAnimationFrame(()=>loop(me))}
function startHome(){if(homeOn)return;homeOn=true;const me=++hid;if(still)intro=false;leaving=false;$('home').classList.remove('leaving');
 $('home').style.setProperty('--hd',intro?'3.8s':'1.6s');
 const go=()=>{if(me!==hid)return;initP();requestAnimationFrame(()=>loop(me))};
 intro?(LOGOIMG.decode?LOGOIMG.decode().then(go,go):(LOGOIMG.onload=go)):go()}
function stopHome(){homeOn=false;hid++}
$('home').addEventListener('pointermove',e=>{mx=e.clientX;my=e.clientY});
$('home').addEventListener('pointerleave',()=>{mx=my=-999});
addEventListener('resize',()=>{if(homeOn){size();if(intro&&!burst&&logoC)makeLogo();retarget()}});
function leave(){if(!homeOn||leaving||intro||!PS.length)return;leaving=true;tL=performance.now();PS.forEach(p=>{p.ld=Math.random()*750;p.la=.5+Math.random()*1.2});$('home').classList.add('leaving')}
$('home').addEventListener('wheel',e=>{if(e.deltaY>8)leave()},{passive:true});
let ty0=0;$('home').addEventListener('touchstart',e=>{ty0=e.touches[0].clientY},{passive:true});
$('home').addEventListener('touchmove',e=>{if(ty0-e.touches[0].clientY>40)leave()},{passive:true});
addEventListener('keydown',e=>{if(homeOn&&['ArrowDown','PageDown',' '].includes(e.key)){e.preventDefault();leave()}});
$('home').querySelector('.hbar a').addEventListener('click',e=>{e.preventDefault();intro?location.hash='work':leave()});
$('photo').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const im=new Image();im.onload=()=>{custom=im;retarget();t0=performance.now()-2000};im.src=URL.createObjectURL(f)});
// disc entrance: particles rain in from above and form the discs
const cv2=$('cv2'),g3=cv2.getContext('2d');let OP=[],oT=0,oOn=false;
function discTargets(n){const W=innerWidth,H=innerHeight,s=Math.min(W*.5,H*.62),D=[];
 for(let d=0;d<3;d++){const r=s*(1-Math.min(d,2.4)*.13)/2;D.push([W/2+d*W*.36,H*.46-d*H*.13,r,r*r])}
 const tot=D.reduce((a,b)=>a+b[3],0),out=[];
 for(let j=0;j<n;j++){let q=Math.random()*tot,k=0;while(k<2&&q>D[k][3]){q-=D[k][3];k++}
  const[x,y,r]=D[k],rim=Math.random()<.22,rr=rim?r*(.97+Math.random()*.03):r*(.22+Math.sqrt(Math.random())*.78),t=Math.random()*6.283;
  out.push(x+Math.cos(t)*rr,y+Math.sin(t)*rr)}
 return out}
function startEnter(){const W=innerWidth,H=innerHeight,r=Math.min(devicePixelRatio||1,2);cv2.width=W*r;cv2.height=H*r;g3.setTransform(r,0,0,r,0,0);cv2.style.display='block';
 const n=W<700?5000:9500,T=discTargets(n);OP=[];
 for(let j=0;j<n;j++)OP.push({x:Math.random()*W,y:-10-Math.random()*H*.5,vx:(Math.random()-.5)*2,vy:3+Math.random()*10,tx:T[j*2],ty:T[j*2+1],dl:Math.random()*600});
 oT=performance.now();if(!oOn){oOn=true;requestAnimationFrame(oLoop)}}
function oLoop(){const t=performance.now()-oT,W=innerWidth,H=innerHeight;g3.clearRect(0,0,W,H);
 const tv=matchMedia('(prefers-color-scheme:dark)').matches?236:17,v=Math.round(255+(tv-255)*Math.min(1,t/900));
 g3.fillStyle=`rgb(${v},${v},${v})`;g3.globalAlpha=Math.max(0,Math.min(1,1-(t-1250)/650));
 for(const p of OP){if(t>p.dl){p.vx=(p.vx+(p.tx-p.x)*.014)*.92;p.vy=(p.vy+(p.ty-p.y)*.014)*.92;p.x+=p.vx;p.y+=p.vy}g3.fillRect(p.x,p.y,1.6,1.6)}
 g3.globalAlpha=1;
 if(t>1950||location.hash!=='#work'){cv2.style.display='none';oOn=false;return}
 requestAnimationFrame(oLoop)}
// routing
function route(){
 const h=location.hash.slice(1),i=P.findIndex(p=>p.s===h),pr=$('project');
 const home=$('home'),isHome=i<0&&h!=='work';
 const wasHome=document.body.classList.contains('home');
 document.body.classList.toggle('home',isHome);
 if(isHome){running=false;work.style.display='none';pr.style.display='none';$('ctr').style.display=$('hint').style.display='none';$('navwork').className='';home.style.display='block';document.title='Karan S Achar';startHome();return}
 home.style.display='none';stopHome();
 if(i<0){running=true;enter=wasHome?performance.now():0;if(wasHome){target=pos=0;ip=ipT=0}else{ip=ipT=1}work.style.display='';pr.style.display='none';$('ctr').style.display=$('hint').style.display='';$('navwork').className='on';document.title='Karan S Achar — Work';return}
 running=false;work.style.display='none';$('ctr').style.display=$('hint').style.display='none';$('navwork').className='';
 const p=P[i],pv=P[(i+P.length-1)%P.length],nx=P[(i+1)%P.length];
 document.title=p.t+' — Karan S Achar';
 pr.innerHTML=`<div class="pgrid"><div><small style="font:400 11px var(--mono);letter-spacing:.16em;color:var(--mute)">${pad(i)} / ${p.year}</small><h1>${p.t}</h1><p>${p.d}</p>
 <div class="row" style="max-width:420px;margin-top:24px"><b>Role</b><span>${p.role.join(', ')}</span></div><div class="row" style="max-width:420px"><b>Built with</b><span>${p.tools.join(', ')}</span></div></div>
 <div class="pdisc">${disc(p,i).replace('class="note"','class="note" style="display:none"')}</div></div>
 <div class="pnav"><a href="#${pv.s}">← ${pv.t}</a><a href="#work">All work</a><a href="#${nx.s}">${nx.t} →</a></div>`;
 pr.style.display='block';pr.scrollTop=0;
 target=pos=i;
}
addEventListener('hashchange',route);
route();frame();
</script>
</body>
